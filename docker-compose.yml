services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/CourierPulse.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CourierPulse;User Id=sa;Password=Your_password123;TrustServerCertificate=True"
      Jwt__Issuer: "CourierPulse.Api"
      Jwt__Audience: "CourierPulse.Clients"
      Jwt__SigningKey: "dev-only-signing-key-do-not-use-in-production-0123456789"
      Cors__FrontendOrigin: "http://localhost:8080"
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/CourierPulse.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Api__BaseUrl: "http://api:8080"
    ports:
      - "8080:8080"
    depends_on:
      - api
